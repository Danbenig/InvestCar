<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="t2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="100%" stop-color="#0e101f" />
    </linearGradient>
    <linearGradient id="t2Ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Glow -->
  <rect width="240" height="240" rx="120" fill="url(#t2Bg)" />
  <circle cx="120" cy="120" r="118" stroke="url(#t2Ring)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Geometric Investor Profile Silhouette (Executive Style) -->
  <g transform="translate(120, 110)">
    <!-- Hair Arc -->
    <path d="M -34 -25 C -34 -55, 34 -55, 34 -25 C 34 5, 28 20, 28 20 L -28 20 C -28 20, -34 5, -34 -25 Z" fill="#312e81" opacity="0.6" />
    <!-- Head -->
    <circle cx="0" cy="-22" r="28" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Neck & Collar -->
    <rect x="-10" y="6" width="20" height="15" fill="#475569" />
    <!-- Blazer / Suit -->
    <path d="M -50 55 C -50 24, -30 16, 0 16 C 30 16, 50 24, 50 55 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <path d="M -20 18 L 0 45 L 20 18" stroke="#818cf8" stroke-width="1.5" fill="none" />
  </g>

  <!-- Verified Badge -->
  <circle cx="175" cy="170" r="16" fill="#4f46e5" stroke="#0f172a" stroke-width="3" />
  <path d="M 169 170 L 173 174 L 181 166" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Bottom Placeholder Indicator -->
  <g transform="translate(120, 215)" text-anchor="middle">
    <rect x="-80" y="-10" width="160" height="20" rx="10" fill="#0b0f19" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" />
    <text y="4" font-family="'InvestSans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
      TESTIMONIALS-2.SVG
    </text>
  </g>
</svg>
